kind = "web"
previewPath = "/"
title = "Billions Dashboard"
version = "1.0.0"

[[services]]
localPort = 3000
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/billions-dashboard run dev"

[services.production]

[services.production.build]
args = ["sh", "-c", "pnpm --filter @workspace/billions-dashboard run build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["sh", "-c", "pnpm --filter @workspace/billions-dashboard run start"]

[services.production.run.env]
PORT = "3000"
NODE_ENV = "production"
